# Cloudflare Worker for Amar Agartala.
# Static files come from dist/ (vite build) via Workers Static Assets;
# worker/index.ts serves /api/* and hands everything else to the assets.
name = "agartala"
main = "worker/index.ts"
compatibility_date = "2024-10-22"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Players must sign in with Google before they get a farm (no guest play) — keeps bots out.
# Only takes effect once AUTH_SECRET, GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are set. "0" allows guests.
[vars]
REQUIRE_SIGNIN = "1"

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "agartala"
database_id = "021c61cd-4aed-4386-a55b-b1ade3ed5060"

# Secrets are not kept here. Set them with:
#   npx wrangler secret put AUTH_SECRET
#   npx wrangler secret put GOOGLE_CLIENT_ID
#   npx wrangler secret put GOOGLE_CLIENT_SECRET
#   npx wrangler secret put RESEND_API_KEY     (optional, for email links)
# For `npm run cf:dev`, put the same keys in .dev.vars (git-ignored).

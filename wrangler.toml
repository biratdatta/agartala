# Cloudflare Pages project for Haora Bari · Agartala.
# Static files come from dist/ (vite build); functions/api/[[path]].ts serves /api/*.
name = "agartala"
pages_build_output_dir = "dist"
compatibility_date = "2024-10-22"

[[d1_databases]]
binding = "DB"
database_name = "agartala"
# Paste the id printed by: npx wrangler d1 create agartala
database_id = "021c61cd-4aed-4386-a55b-b1ade3ed5060"

# Secrets are not kept here. Set them with:
#   npx wrangler pages secret put AUTH_SECRET
#   npx wrangler pages secret put GOOGLE_CLIENT_ID
#   npx wrangler pages secret put GOOGLE_CLIENT_SECRET
#   npx wrangler pages secret put RESEND_API_KEY     (optional, for email links)
# For `npm run cf:dev`, put the same keys in .dev.vars (git-ignored).
